[package]
name = "software_licensor_static_rust_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "softwarelicensor"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
prost-build = { version = "0.14.3", optional = true }

[features]
default = []
build-protos = ["prost-build"]
rlib = ["libc", "windows-sys"]
serde = ["dep:serde"]

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
p384 = { version = "0.13.0", features = ["ecdsa"]}
prost = "0.14.3"
prost-types = "0.14.3"
rand = "0.8.5"
reqwest = { version = "0.13.2", features = ["rustls"], default-features = false}
serde = { version = "1.0.228", optional = true, features = ["derive"] }
sha2 = "0.10.8"
tokio = { version = "1.38.1", features = ["rt", "rt-multi-thread", "macros"]}

[target.'cfg(target_os = "macos")'.dependencies]
directories = "6.0"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
] }
